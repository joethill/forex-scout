<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forex Scout Sniper v2</title>

<style>
body{
font-family:Arial;
background:#111827;
color:white;
padding:15px;
}

h1{
text-align:center;
color:#22c55e;
}

.card{
background:#1f2937;
border-radius:12px;
padding:15px;
margin:12px 0;
}

.buy{
color:#22c55e;
font-size:24px;
font-weight:bold;
}

.sell{
color:#ef4444;
font-size:24px;
font-weight:bold;
}

.wait{
color:#facc15;
font-size:24px;
font-weight:bold;
}

button{
width:100%;
padding:15px;
background:#22c55e;
color:white;
border:0;
border-radius:10px;
font-size:18px;
}
</style>

</head>

<body>

<h1>🚀 Forex Scout Sniper v2</h1>

<div id="app"></div>

<button onclick="scan()">RUN SCANNER</button>

<script>

const pairs=[
"EUR/USD",
"GBP/USD",
"USD/JPY",
"AUD/USD",
"USD/CAD",
"USD/CHF",
"NZD/USD"
];

function scan(){

let output="";

for(let pair of pairs){

let trend=Math.floor(Math.random()*26);
let momentum=Math.floor(Math.random()*26);
let structure=Math.floor(Math.random()*26);
let risk=Math.floor(Math.random()*26);

let score=trend+momentum+structure+risk;

let signal="WAIT";
let css="wait";

if(score>=80){
signal="BUY";
css="buy";
}

if(score<55){
signal="SELL";
css="sell";
}

let entry=(1.1000+Math.random()*0.0500).toFixed(4);
let stop=(Number(entry)-0.0030).toFixed(4);
let target=(Number(entry)+0.0060).toFixed(4);

output += `
<div class="card">

<h2>${pair}</h2>

<div class="${css}">
${signal}
</div>

<p>
Confidence: ${score}/100
</p>

<p>
Entry: ${entry}<br>
Stop: ${stop}<br>
Target: ${target}<br>
Risk/Reward: 1:2
</p>

<p>
Trend: ${trend}/25<br>
Momentum: ${momentum}/25<br>
Structure: ${structure}/25<br>
Risk: ${risk}/25
</p>

</div>
`;

}

document.getElementById("app").innerHTML=output;

}

scan();

</script>

</body>
</html>
