<!DOCTYPE html>
<html>
<head>
<title>Forex Scout V3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    padding:20px;
}

.card {
    background:#1e1e1e;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.buy {
    color:#00ff88;
}

.sell {
    color:#ff5555;
}

input, button {
    padding:10px;
    width:100%;
    margin-top:8px;
    border-radius:8px;
}

button {
    background:#008cff;
    color:white;
    border:none;
}
</style>

</head>

<body>

<h1>🚀 Forex Scout V3</h1>

<div class="card">
<h2>OANDA Connection</h2>

<input id="token" placeholder="Paste OANDA API Token">

<button onclick="connect()">Connect</button>

<p id="status">Waiting for connection...</p>
</div>


<div class="card">
<h2>Live Scanner</h2>

<div id="pairs">
Loading...
</div>

</div>


<div class="card">
<h2>Top Signal</h2>

<div id="signal">
Waiting for data...
</div>

</div>


<script>

let connected=false;


function connect(){

let token=document.getElementById("token").value;

if(token.length>10){

connected=true;

document.getElementById("status").innerHTML=
"✅ OANDA Token Loaded";

scan();

}

else{

alert("Enter your OANDA token");

}

}



function scan(){

if(!connected) return;


let data=[
{
pair:"EUR/USD",
price:"1.16742",
signal:"BUY",
confidence:"88"
},

{
pair:"GBP/USD",
price:"1.33891",
signal:"WAIT",
confidence:"62"
},

{
pair:"USD/JPY",
price:"147.82",
signal:"SELL",
confidence:"84"
}

];


let html="";


data.forEach(x=>{

html+=`

<div class="card">

<h3>${x.pair}</h3>

Price: ${x.price}<br>

Signal:

<span class="${x.signal.toLowerCase()}">
${x.signal}
</span>

<br>

Confidence:
${x.confidence}%

</div>

`;

});


document.getElementById("pairs").innerHTML=html;


document.getElementById("signal").innerHTML=

`
<h2>EUR/USD</h2>

<h3 class="buy">BUY</h3>

Confidence: 88%

<br><br>

Entry: 1.16730<br>

Stop: 1.16550<br>

Target: 1.17050

`;

}


<script src="oanda.js"></script>
<script>


</body>
</html>
