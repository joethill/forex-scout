<!DOCTYPE html>
<html>
<head>

<title>Forex Scout V3</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
font-family: Arial;
background:#111;
color:white;
padding:20px;
}

.card {
background:#222;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input,button {
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
}

button {
background:#008cff;
color:white;
border:none;
}

.buy {
color:#00ff88;
}

.sell {
color:#ff5555;
}

</style>

</head>


<body>

<h1>🚀 Forex Scout V3</h1>


<div class="card">

<h2>OANDA Setup</h2>

<input id="token" placeholder="OANDA API Token">

<input id="account" placeholder="OANDA Account ID">

<button onclick="connect()">Connect</button>

<p id="status">
Not connected
</p>

</div>


<div class="card">

<h2>Live Quotes</h2>

<div id="quotes">
Waiting...
</div>

</div>


<div class="card">

<h2>Sniper Signal</h2>

<div id="signal">
Waiting...
</div>

</div>



<script src="oanda.js"></script>
<script src="scanner.js"></script>


<script>

function connect(){

let token =
document.getElementById("token").value;

let account =
document.getElementById("account").value;


if(token && account){

setCredentials(token,account);


document.getElementById("status").innerHTML =
"✅ Connected";


loadQuotes();

}

else{

alert("Enter OANDA token and account ID");

}

}



async function loadQuotes(){

let pairs=[
"EUR_USD",
"GBP_USD",
"USD_JPY"
];


let output="";


for(let pair of pairs){

let price =
await getPrice(pair);


if(price){

output +=
pair +
" : " +
price +
"<br>";

}

}


document.getElementById("quotes").innerHTML =
output;


}


</script>


</body>

</html>
