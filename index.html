<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forex Scout Sniper</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#111827;
  color:white;
  margin:0;
  padding:15px;
}

h1 {
  text-align:center;
  color:#22c55e;
}

.card {
  background:#1f2937;
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 0 10px #000;
}

.buy {
  color:#22c55e;
  font-weight:bold;
}

.sell {
  color:#ef4444;
  font-weight:bold;
}

.wait {
  color:#facc15;
  font-weight:bold;
}

.label {
  color:#9ca3af;
}

button {
  width:100%;
  padding:15px;
  background:#22c55e;
  color:white;
  border:none;
  border-radius:10px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>🚀 Forex Scout Sniper</h1>

<div id="scan"></div>

<button onclick="runScan()">Run New Scan</button>

<script>

const pairs = [
"EUR/USD",
"GBP/USD",
"USD/JPY",
"AUD/USD",
"USD/CAD",
"USD/CHF",
"NZD/USD"
];

function runScan(){

let output="";

pairs.forEach(pair=>{

let score=Math.floor(Math.random()*25)+70;

let signals=[
["BUY","buy"],
["SELL","sell"],
["WAIT","wait"]
];

let signal=signals[Math.floor(Math.random()*3)];

let entry=(Math.random()*0.2+1.10).toFixed(4);

let stop=(Number(entry)-0.0030).toFixed(4);

let target=(Number(entry)+0.0060).toFixed(4);

output+=`

<div class="card">

<h2>${pair}</h2>

<h3 class="${signal[1]}">
${signal[0]}
</h3>

<p>
<span class="label">Entry:</span> ${entry}<br>
<span class="label">Stop:</span> ${stop}<br>
<span class="label">Target:</span> ${target}<br>
<span class="label">Risk/Reward:</span> 1:2
</p>

<p>
Confidence Score:
<b>${score}/100</b>
</p>

<p>
Reason:
<br>
✓ Trend check<br>
✓ Momentum check<br>
✓ Support/resistance check
</p>

</div>

`;

});

document.getElementById("scan").innerHTML=output;

}

runScan();

</script>

</body>
</html>
