Run Forex Scout Scan

<script>

function calculateScore(pair){

let trend =
Math.floor(Math.random()*25)+65;

let momentum =
Math.floor(Math.random()*20)+60;

let volatility =
Math.floor(Math.random()*15)+60;


let total =
Math.floor(
(trend*.4)+
(momentum*.35)+
(volatility*.25)
);


let direction;


if(total >=80){

direction="BUY";

}

else if(total <=65){

direction="SELL";

}

else{

direction="WAIT";

}


return {

score: total,
signal: direction,
trend: trend,
momentum: momentum,
volatility: volatility

};

}


function createTrade(pair){

let data =
calculateScore(pair);


let entry =
"Calculated after live feed";


let stop =
"ATR based stop";


let target =
"2:1 reward target";


return {

pair:pair,
score:data.score,
signal:data.signal,
entry:entry,
stop:stop,
target:target,

reasons:[

"Trend strength: "+data.trend+"/100",

"Momentum: "+data.momentum+"/100",

"Volatility: "+data.volatility+"/100"

]

};

}

async function getLivePrice(pair){

try{

let symbol = pair.replace("/","");

let response = await fetch(
`https://api.frankfurter.app/latest?from=${symbol.substring(0,3)}&to=${symbol.substring(3,6)}`
);

let data = await response.json();

return data.rates[symbol.substring(3,6)];

}

catch(error){

return "Unavailable";

}
async function getTwelvePrice(symbol){

try{

let response = await fetch(
`https://api.twelvedata.com/price?symbol=${symbol}&apikey=${TWELVE_KEY}`
);

let data = await response.json();

return data.price || "No price";

}

catch(error){

return "Error";

}

}
}
async function runScanner(){

let pairs=[

"EUR/USD",
"GBP/USD",
"USD/JPY",
"AUD/USD",
"USD/CAD"

];


let html="";


for(let pair of pairs){


let price = await getTwelvePrice(pair);


let trade = createTrade(pair);


html += `

<div class="card">

<h2>${trade.pair}</h2>

<div class="${trade.signal.toLowerCase()}">
${trade.signal}
</div>

<div class="score">
Sniper Score: ${trade.score}/100
</div>

<br>

${trade.entry}

<br><br>

Stop:
${trade.stop}

<br><br>

Target:
${trade.target}

<div class="reason">

<b>Why:</b><br>

${trade.reasons.join("<br>")}

</div>

</div>

`;

}


document.getElementById("results").innerHTML=html;


}
