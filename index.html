<!DOCTYPE html>
<html>
<head>
<title>Forex Scout V3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:#111;
color:white;
padding:15px;
}

h1{
text-align:center;
}

.card{
background:#222;
border-radius:12px;
padding:15px;
margin:12px 0;
}

.buy{
color:#00ff88;
font-size:24px;
}

.sell{
color:#ff5555;
font-size:24px;
}

.wait{
color:#ffd000;
font-size:24px;
}

button{
width:100%;
padding:14px;
border-radius:10px;
border:0;
background:#008cff;
color:white;
font-size:18px;
}
</style>

</head>

<body>

<h1>🚀 Forex Scout V3</h1>

<button onclick="scan()">Run Sniper Scan</button>

<div id="results"></div>


<script>

function scan(){

let pairs=[

{
pair:"EUR/USD",
signal:"BUY",
confidence:86,
entry:"1.1670",
stop:"1.1645",
target:"1.1710"
},

{
pair:"GBP/USD",
signal:"WAIT",
confidence:61,
entry:"—",
stop:"—",
target:"—"
},

{
pair:"USD/JPY",
signal:"SELL",
confidence:82,
entry:"147.80",
stop:"148.60",
target:"146.40"
},

{
pair:"AUD/USD",
signal:"BUY",
confidence:78,
entry:"0.6520",
stop:"0.6495",
target:"0.6570"
},

{
pair:"USD/CAD",
signal:"WAIT",
confidence:55,
entry:"—",
stop:"—",
target:"—"
}

];


let html="";


pairs.forEach(p=>{

let cls=p.signal.toLowerCase();


html+=`

<div class="card">

<h2>${p.pair}</h2>

<div class="${cls}">
${p.signal}
</div>

<br>

Confidence: ${p.confidence}%<br><br>

Entry: ${p.entry}<br>

Stop Loss: ${p.stop}<br>

Take Profit: ${p.target}

</div>

`;

});


document.getElementById("results").innerHTML=html;

}

</script>


</body>
</html>
